name: Build and test Epinizer
on: [workflow_dispatch]
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Epinizer-macOS-AU
          path: dist/*
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Epinizer-Windows-VST3
          path: dist/*.zip
